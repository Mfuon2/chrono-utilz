name: Verify and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chrono-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/benchmark.cjs
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium firefox webkit
      - if: matrix.node == 24
        run: npm run test:browsers
      - if: matrix.node == 24
        run: npm run test:mutation
      - if: matrix.node == 24
        run: npm run coverage
      - if: matrix.node == 24
        run: mkdir -p release && npm pack --ignore-scripts --pack-destination release
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-node-${{ matrix.node }}
          path: |
            docs/bundle-sizes.json
            docs/benchmarks.json
            coverage/lcov.info
            reports/mutation/mutation.json
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate tag
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Publish the verified tarball
        run: npm publish ./release/*.tgz --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public installation
        run: |
          mkdir /tmp/chrono-release
          cd /tmp/chrono-release
          for attempt in 1 2 3 4 5; do
            npm install --ignore-scripts "@mfuon2/chrono-utilz@${GITHUB_REF_NAME#v}" && break
            sleep 5
          done
          node -e "const assert=require('node:assert/strict'); const c=require('@mfuon2/chrono-utilz'); assert.equal(c.formatDate(c.addBusinessDays('2025-01-03',3)), '2025-01-08')"
