name: Verify and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (leave empty for verification only)
        required: false
        type: string
      verified_run_id:
        description: Previous run containing the verified npm-package artifact
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: chrono-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/benchmark.cjs
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium firefox webkit
      - if: matrix.node == 24
        run: npm run test:browsers
      - if: matrix.node == 24
        run: npm run test:mutation
      - if: matrix.node == 24
        run: npm run coverage
      - if: matrix.node == 24
        run: mkdir -p release && npm pack --ignore-scripts --pack-destination release
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-node-${{ matrix.node }}
          path: |
            docs/bundle-sizes.json
            docs/benchmarks.json
            coverage/lcov.info
            reports/mutation/mutation.json
  publish:
    needs: verify
    if: always() && ((startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: npm-publish
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify the source run and release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process');
          const {RELEASE_TAG,VERIFIED_RUN_ID,GITHUB_REPOSITORY}=process.env;
          assert(/^v\d+\.\d+\.\d+$/.test(RELEASE_TAG),'Expected a version tag');
          assert(/^\d+$/.test(VERIFIED_RUN_ID),'Expected a numeric run ID');
          assert.equal(RELEASE_TAG,'v'+require('./package.json').version);
          const api=path=>JSON.parse(execFileSync('gh',['api',`repos/${GITHUB_REPOSITORY}/${path}`],{encoding:'utf8'}));
          const run=api(`actions/runs/${VERIFIED_RUN_ID}`);
          assert.equal(run.path,'.github/workflows/ci.yml');
          assert.equal(run.head_sha,execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());
          const jobs=api(`actions/runs/${VERIFIED_RUN_ID}/jobs?per_page=100`).jobs;
          for(const name of ['verify (22)','verify (24)']) assert(jobs.some(job=>job.name===name&&job.conclusion==='success'),`${name} must pass`);
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
          run-id: ${{ inputs.verified_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify packed version and publish
        run: |
          test "$(tar -xOf ./release/*.tgz package/package.json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')" = "${RELEASE_TAG#v}"
          npm publish ./release/*.tgz --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public installation
        run: |
          mkdir /tmp/chrono-release
          cd /tmp/chrono-release
          npm install --ignore-scripts "@mfuon2/chrono-utilz@${RELEASE_TAG#v}"
          node -e "const assert=require('node:assert/strict'); const c=require('@mfuon2/chrono-utilz'); assert.equal(c.formatDate(c.addBusinessDays('2025-01-03',3)), '2025-01-08')"
